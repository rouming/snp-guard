name: Release Tools

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and publish images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        run: |
          docker buildx build \
            --target tools \
            -t ghcr.io/${{ github.repository_owner }}/snpguard-tools:${{ steps.tag.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/snpguard-tools:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            .
          docker buildx build \
            --target server \
            -t ghcr.io/${{ github.repository_owner }}/snpguard-server:${{ steps.tag.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/snpguard-server:latest \
            --cache-from type=gha \
            --push \
            .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Images

            ### snpguard-tools

            Client and image-conversion tools:

            ```
            docker pull ghcr.io/${{ github.repository_owner }}/snpguard-tools:${{ steps.tag.outputs.version }}
            ```

            ```
            docker run --rm -it --privileged \
                --network host \
                -v $PWD:/work \
                -v $HOME/.config:/root/.config \
                ghcr.io/${{ github.repository_owner }}/snpguard-tools:${{ steps.tag.outputs.version }} \
                <snpguard-image|snpguard-client> ...
            ```

            - `--privileged` gives the container access to `/dev/kvm`, which libguestfs uses to accelerate its internal QEMU appliance; without it libguestfs falls back to software emulation (TCG) and runs significantly slower
            - `-v $PWD:/work` makes local image files accessible inside the container
            - `-v $HOME/.config:/root/.config` persists `snpguard-client` config across runs

            ### snpguard-server

            Attestation server:

            ```
            docker pull ghcr.io/${{ github.repository_owner }}/snpguard-server:${{ steps.tag.outputs.version }}
            ```

            ```
            # Generate TLS certificates once before first start
            ./scripts/generate-tls-certs.sh --output data/tls --ip ${IP}

            docker run -d \
                --name snp-guard \
                -p 3000:3000 \
                -v "$(pwd)/data:/data" \
                -e DATA_DIR=/data \
                -e NO_TLS= \
                --restart unless-stopped \
                ghcr.io/${{ github.repository_owner }}/snpguard-server:${{ steps.tag.outputs.version }}

            # Get master password from logs on first start
            docker logs snp-guard
            ```
